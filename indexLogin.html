<!DOCTYPE html>
<html lang="en">
<head>
    <title>LOGIN</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheetL.css">
</head>
<body>
    <form id="loginForm">
        <div class="main">
            <div class="head">
                <h1 class="title">WELCOME</h1>
                <div class="lang">
                    <select id="languageSelect" class="langSelect" onchange="changeLanguage()">
                        <option value="en">English</option>
                        <option value="hi">हिन्दी</option>
                        <option value="gu">ગુજરાતી</option>
                        <option value="mr">मराठी</option>
                        <option value="bn">বাংলা</option>
                    </select>
                </div>
            </div>
            <div class="credits">
                <div class="id">
                    <label for="user" id="labelid">Enter User ID :</label>
                    <input  class="userId" type="text" id="userid" name="user">
                </div>
                <div class="pass">
                    <label for="password" id="labelpass">Enter Password :</label>
                    <input class="ps" type="password" id="password" name="password">
                </div>
            </div>
            <div class="btn1">
                <button type="submit" class="btn" id="loginBtn">Login</button>
            </div>
        </div>
</form>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        const username = document.getElementById("userid").value.trim();
        const password = document.getElementById("password").value.trim();
        if (!username || !password) {
            alert("Invalid credentials");
            return;
        }
        try {
            const response = await fetch("http://localhost:5000/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
            });
            const data = await response.json();
            if (response.ok) {
                sessionStorage.setItem("token", data.token);
                window.location.replace("index.html");
            } else {
                alert(data.message);
            }
            } catch (error) {
                alert("Server error");
            }
        });
        const translations = {
        en: {
            idLabel: "Enter User ID",
            passLabel: "Enter Password",
            loginBtn: "Login"
        },
        hi: {
            idLabel: "यूज़र आईडी दर्ज करें",
            passLabel: "पासवर्ड दर्ज करें",
            loginBtn: "लॉगिन"
        },
        gu: {
            idLabel: "યૂઝર આઈડી દાખલ કરો",
            passLabel: "પાસવર્ડ દાખલ કરો",
            loginBtn: "લોગિન"
        },
        mr: {
            idLabel: "यूजर आयडी टाका",
            passLabel: "पासवर्ड टाका",
            loginBtn: "लॉगिन"
        },
        bn: {
            idLabel: "ইউজার আইডি লিখুন",
            passLabel: "পাসওয়ার্ড লিখুন",
            loginBtn: "লগইন"
        }
        };
        function changeLanguage() {
        const lang = document.getElementById("languageSelect").value;
        localStorage.setItem("lang", lang); 
        const idLabel = document.getElementById("labelid");
        const passLabel = document.getElementById("labelpass");
        const loginBtn = document.getElementById("loginBtn");
        if (idLabel) idLabel.innerText = translations[lang].idLabel;
        if (passLabel) passLabel.innerText = translations[lang].passLabel;
        if (loginBtn) loginBtn.innerText = translations[lang].loginBtn;
        }
        window.onload = function() {
        const savedLang = localStorage.getItem("lang") || "en";
        document.getElementById("languageSelect").value = savedLang;
        changeLanguage();
        };
</script>
</body>
</html>
